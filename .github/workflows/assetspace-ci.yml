name: AssetSpace CI (reusable)

# Reusable per-AssetSpace SHACL CI gate for the Exocortex Knowledge Architecture
# (EKA Alpha 16-repo schema). Canonical home: kitelev/exoas-ci ;
# .github/workflows/assetspace-ci.yml@main. The copy under exocortex/docs/ci/
# is the REVIEWED REFERENCE COPY (issue #3513) — keep it in sync with exoas-ci.
#
# What it does, for the calling AssetSpace repo's checked-out content:
#   1. resolve-deps — resolve the repo's transitive exo__AssetSpace_dependsOn
#      closure from the central registry (kitelev/exoas-registry), so the
#      dependent TBox is materialised and cross-repo class references resolve
#      (issue #3513, builds on #3511).
#   2. validate schema --shapes-mode --vault <merged> — SHACL-lite conformance
#      over a SINGLE MERGED vault that contains the calling repo's content +
#      every resolved dependency, unified under one vault root (one link index,
#      one graph). Genuine sh:Violation fails the gate (exit 1); unresolvable
#      cross-repo refs are sh:Warning (do NOT fail).
#   3. audit ontology-imports — cross-ontology closure / SCC check (advisory).
#   4. audit ontology-membership — exo__Ontology_admits allow-list conformance
#      (KSD ArchUnit cohesion ratchet, req c23f6f50): every member of an ontology
#      declaring exo__Ontology_admits must carry an admitted exo__Instance_class
#      (subsumption-aware). Fail-open (ontologies without _admits are skipped);
#      gates like SHACL (exit 1) unless warn_only.
#   5. command smoke (OPT-IN, `command_smoke: true`) — behavioural check that a
#      homoiconic command still WRITES what its inheritance rules promise, not
#      merely that the data validates. Seeds an ems__Task fixture into the merged
#      vault, runs `apply <command_smoke_cli>` for real (⛔ not --dry-run — that
#      prints no frontmatter), and asserts the created asset carries
#      ems__Effort_parent pointing at the fixture, then re-runs SHACL to prove
#      the write introduced no new violation. Gates like SHACL unless warn_only.
#   6. audit assetspace-depends --self <owner/repo> — exo__AssetSpace_dependsOn
#      COVERAGE gate (RFC 306dcb5c, req 04208713): every definition-tier
#      cross-AssetSpace reference made by THIS repo must have its target inside
#      the repo's declared dependsOn transitive closure — i.e. inside the very
#      merged vault step 2 validates. Judged BY CLOSURE (never by the direct
#      declaration), one-sided, no cycle check on the declared graph (dependsOn
#      is packaging). A reference that resolves to nothing in the merged vault
#      counts as uncovered: that is exactly the TBox the SHACL step is missing —
#      UNLESS the target belongs to a declared dependsOn that step 1 could NOT
#      clone (private repo, no usable token): those are passed to the verb via
#      --missing-deps-file and the verdict DEGRADES explicitly (req 8d432214):
#      `OK (DEGRADED: declared deps absent from merged vault: …)`, exit 0, with
#      the blind spot printed (an excused ref may point into an UNDECLARED
#      absent AssetSpace — coverage is NOT proven for it). References into a
#      PRESENT but undeclared AssetSpace still FAIL. ⚠ DEGRADED is not proven
#      coverage: give registry_token to make the merged vault complete.
#      Gates like SHACL unless warn_only (or depends_gate: false).
#      ⚠ NAMED LIMITATION (not a full gate, by design of the frame): this runs on
#      the AssetSpace repo's OWN push. It CANNOT catch the DELETION of a
#      dependsOn declaration — that edit lands in kitelev/exoas-registry, whose
#      push never triggers this repo's CI; the coverage only re-checks here on
#      the next push of the dependent repo. The registry-side/scheduled
#      detector (RFC 306dcb5c N3) is the complement; do not read a green step 6
#      as "every declaration in the registry is still there".
#
# MERGE vs --also (issue #3523, orchestrator decision 2026-06-14, Option 2):
# Earlier this gate passed each dependency as a separate `--also <dir>` vault.
# That produced FALSE sh:class violations: a cross-vault wikilink reference
# resolves to filename-form IRI (obsidian://vault/<uid>.md) while its subject —
# parsed in the separate --also vault — is stored under symbolic-form IRI
# (https://exocortex.my/ontology/<ns>#<local>); the forms don't unify across the
# --also boundary, so a valid class membership read as a violation. Empirically
# (CLI 16.92.0): exoas-exocmd = 0 standalone, 30 with `--also`, 0 when deps are
# merged into ONE vault dir. Fix: assemble a single merged vault (rsync deps +
# self into one root) and validate it as one graph — the CLI de-dups by subject,
# so cross-repo class membership resolves correctly. #3523 stays open as the
# proper CLI-side `--also` IRI-unify fix (fast-follow); this gate no longer
# depends on it.
#
# Caller usage (.github/workflows/ci.yml in an AssetSpace repo):
#   jobs:
#     ci:
#       uses: kitelev/exoas-ci/.github/workflows/assetspace-ci.yml@main
#       with:
#         warn_only: false        # flip to false once the repo is gate-green
#         resolve_deps: true      # registry-driven dependent-TBox resolution

on:
  workflow_call:
    inputs:
      warn_only:
        description: "Non-blocking mode (true = warn-only pilot, false = blocking gate)"
        type: boolean
        default: true
      resolve_deps:
        description: "Resolve + materialise dependent TBox via the central registry (issue #3513). Disable only for a fully self-contained repo."
        type: boolean
        default: true
      registry_url:
        description: "Central registry clone URL (holds exo__AssetSpace descriptors + dependsOn DAG)"
        type: string
        default: "https://github.com/kitelev/exoas-registry"
      cli_version:
        description: "@kitelev/exocortex-cli version spec (must include `resolve-deps` (issue #3513) and `audit assetspace-depends --missing-deps-file` (req 8d432214, >= 16.238.0))"
        type: string
        default: "16.238.0"
      depends_gate:
        description: "Run step 6 (audit assetspace-depends --self, RFC 306dcb5c / req 04208713) as a BLOCKING gate. false = advisory (reported, never fails). Needs a cli_version that ships the verb; older CLIs skip the step with a notice."
        type: boolean
        default: true
      command_smoke:
        description: "Run the opt-in behavioural command smoke (see step 5 in the header). Off by default."
        type: boolean
        default: false
      command_smoke_cli:
        description: "cliName of the command the smoke applies to an ems__Task fixture"
        type: string
        default: "create-action"
      command_smoke_sources:
        description: |
          Extra clone URLs (whitespace/newline separated) merged into the smoke
          vault ON TOP of the dependsOn closure. Needed when the command's
          BEHAVIOUR requires a TBox the calling repo does not ontologically
          depend on — e.g. exoas-exocmd carries the commands but the ems classes
          live in exoas-public, which depends on exocmd, so declaring the
          reverse in the registry would make the dependsOn DAG cyclic. This
          input keeps that runtime-only need out of the ontological graph.
        type: string
        default: ""
    secrets:
      registry_token:
        description: "Optional PAT for cloning the registry + PRIVATE dependency repos. Falls back to anonymous (public repos)."
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve dependent TBox + assemble single merged validation vault
        id: deps
        if: ${{ inputs.resolve_deps }}
        env:
          # Token for cloning registry + private deps. Anonymous if unset (public).
          GH_CLONE_TOKEN: ${{ secrets.registry_token }}
          # Defence-in-depth: restrict git to network transports only, so a
          # malformed descriptor source can't reach a command-executing transport
          # (ext::/file::). resolve-deps already rejects unsafe sources upstream.
          GIT_ALLOW_PROTOCOL: "https:ssh"
        run: |
          set -uo pipefail
          MERGED="$RUNNER_TEMP/merged"
          rm -rf "$MERGED"; mkdir -p "$MERGED"
          # The calling repo's own content goes into the merged vault first, under
          # a unique subdir so dep subdirs can never collide with it. All .md
          # assets end up under one vault root → one link index → one graph.
          rsync -a --exclude='.git' ./ "$MERGED/_self/"
          # Second layout of the SAME content for step 6 (audit assetspace-depends):
          # the verb keys every asset's AssetSpace by its assetspaces/<owner>/<repo>/
          # path prefix (req 04208713 §--self), which _self/_dep-N cannot express.
          # Kept apart from $MERGED so the SHACL/membership steps are byte-identical.
          DEPVAULT="$RUNNER_TEMP/depends-vault"
          rm -rf "$DEPVAULT"; mkdir -p "$DEPVAULT/assetspaces/${{ github.repository }}"
          rsync -a --exclude='.git' ./ "$DEPVAULT/assetspaces/${{ github.repository }}/"

          auth_url() {
            # Inject token into an https URL for private-repo clones; pass through otherwise.
            local url="$1"
            if [ -n "${GH_CLONE_TOKEN:-}" ] && printf '%s' "$url" | grep -q '^https://github.com/'; then
              printf 'https://x-access-token:%s@github.com/%s' "$GH_CLONE_TOKEN" "${url#https://github.com/}"
            else
              printf '%s' "$url"
            fi
          }

          echo "::group::Clone central registry"
          if ! git clone --depth 1 -- "$(auth_url "${{ inputs.registry_url }}")" "$RUNNER_TEMP/registry" 2>/dev/null; then
            echo "⚠️  Could not clone registry ${{ inputs.registry_url }} — validating standalone (deps unresolved → warnings only)."
            echo "merged_dir=$MERGED" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"

          echo "::group::Resolve dependsOn closure for ${{ github.repository }}"
          # resolve-deps prints one dependency clone URL per line (self excluded).
          # Lenient by default: an unregistered repo prints nothing → standalone.
          DEP_URLS="$(npx -y @kitelev/exocortex-cli@${{ inputs.cli_version }} resolve-deps \
            --registry "$RUNNER_TEMP/registry" \
            --self "${{ github.repository }}" \
            --format urls || true)"
          echo "Resolved dependencies:"
          printf '%s\n' "$DEP_URLS"
          echo "::endgroup::"

          echo "::group::Clone + merge dependency repos into the single validation vault"
          # Declared deps that could NOT be cloned, one resolve-deps URL per line —
          # the SAME source --self/the closure are keyed from, so step 6 normalises
          # both sides identically (ownerRepoSlug). Always created (possibly empty)
          # so step 6 can test `-s` without an existence race.
          MISSING_DEPS="$RUNNER_TEMP/missing-deps.txt"
          : > "$MISSING_DEPS"
          i=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            name="dep-$i-$(basename "$url" .git)"
            target="$RUNNER_TEMP/deps/$name"
            if git clone --depth 1 -- "$(auth_url "$url")" "$target" 2>/dev/null; then
              # Merge the dep's content into the single vault under its own subdir.
              rsync -a --exclude='.git' "$target/" "$MERGED/_dep-$i/"
              echo "  ✓ $url → merged/_dep-$i ($name)"
              # owner/repo from the clone URL (resolve-deps emits https://github.com/<owner>/<repo>[.git]).
              slug="${url#https://github.com/}"; slug="${slug%.git}"
              case "$slug" in
                */*) mkdir -p "$DEPVAULT/assetspaces/$slug"
                     rsync -a --exclude='.git' "$target/" "$DEPVAULT/assetspaces/$slug/" ;;
                *)   echo "  ⚠️  $url is not an https://github.com/<owner>/<repo> URL — not laid out for step 6 (its refs will read as unresolved there)" ;;
              esac
            else
              # Best-effort: a dep we can't clone (private, no token). SHACL: refs
              # into it degrade to sh:Warning — never a false violation. Step 6:
              # recorded here and passed as --missing-deps-file, so the coverage
              # verdict DEGRADES explicitly instead of counting them uncovered
              # (req 8d432214). Do not fail.
              printf '%s\n' "$url" >> "$MISSING_DEPS"
              echo "  ⚠️  could not clone $url — skipping (SHACL: refs into it become warnings; step 6: reported as DEGRADED, not uncovered)"
            fi
            i=$((i+1))
          done <<< "$DEP_URLS"
          echo "::endgroup::"

          echo "merged_dir=$MERGED" >> "$GITHUB_OUTPUT"
          echo "depends_vault=$DEPVAULT" >> "$GITHUB_OUTPUT"
          echo "missing_deps_file=$MISSING_DEPS" >> "$GITHUB_OUTPUT"
          if [ -s "$MISSING_DEPS" ]; then
            echo "⚠️  $(wc -l < "$MISSING_DEPS" | tr -d ' ') declared dep(s) NOT materialised — step 6 will judge DEGRADED (coverage not proven for refs into them):"
            sed 's/^/    /' "$MISSING_DEPS"
          fi

      - name: SHACL-lite schema validation (single-graph merged vault, blocking unless warn_only)
        id: shacl
        continue-on-error: ${{ inputs.warn_only }}
        run: |
          set -uo pipefail
          MERGED="${{ steps.deps.outputs.merged_dir }}"
          if [ -n "$MERGED" ] && [ -d "$MERGED" ]; then
            VAULT="$MERGED"
            echo "Validating MERGED single-graph vault (self + resolved deps unified — avoids the cross-vault --also IRI-form mismatch, #3523)."
          else
            # resolve_deps disabled, or registry/deps unavailable → validate the
            # calling repo standalone (cross-repo refs degrade to warnings).
            VAULT="."
            echo "No merged vault available — validating the calling repo standalone."
          fi
          npx -y @kitelev/exocortex-cli@${{ inputs.cli_version }} validate schema \
            --shapes-mode --vault "$VAULT" --output text | tee "$RUNNER_TEMP/shacl-report.txt"
          # Propagate the validate exit code (PIPESTATUS[0]) so violations fail the gate.
          exit "${PIPESTATUS[0]}"

      - name: Ontology-imports audit (cross-ontology closure + SCC)
        id: imports
        continue-on-error: ${{ inputs.warn_only }}
        # ADVISORY by design: reported in the summary but never blocking — the
        # exit code is `tee`'s (always 0), so this step does not gate the merge
        # regardless of `warn_only`. SHACL (above) is the sole blocking gate. To
        # make this gate too, mirror the SHACL step: append `; exit "${PIPESTATUS[0]}"`.
        run: |
          npx -y @kitelev/exocortex-cli@${{ inputs.cli_version }} audit ontology-imports \
            --vault . --output text | tee "$RUNNER_TEMP/imports-report.txt"

      - name: Ontology-membership audit (exo__Ontology_admits allow-list, blocking unless warn_only)
        id: membership
        continue-on-error: ${{ inputs.warn_only }}
        # Cohesion-side KSD ArchUnit ratchet (req c23f6f50) — the complement of
        # the coupling-side ontology-imports audit. Every member of an ontology
        # that DECLARES exo__Ontology_admits must carry an admitted
        # exo__Instance_class (directly or via a exo__Class_superClass
        # subsumption walk). FAIL-OPEN: ontologies without _admits are skipped
        # (audit-first — the ratchet only bites opted-in ontologies), so this is
        # inert for repos that have not authored allow-lists yet. GATES like the
        # SHACL step (`exit "${PIPESTATUS[0]}"`) for gate-green (warn_only:false)
        # repos, advisory for warn-only pilots. Runs on the MERGED single-graph
        # vault so cross-repo class-defs (concept__Concept, exo__Property, …)
        # resolve for the superClass walk (mirrors the SHACL step's VAULT logic).
        run: |
          set -uo pipefail
          MERGED="${{ steps.deps.outputs.merged_dir }}"
          if [ -n "$MERGED" ] && [ -d "$MERGED" ]; then
            VAULT="$MERGED"
          else
            VAULT="."
          fi
          npx -y @kitelev/exocortex-cli@${{ inputs.cli_version }} audit ontology-membership \
            --vault "$VAULT" --output text | tee "$RUNNER_TEMP/membership-report.txt"
          exit "${PIPESTATUS[0]}"

      - name: AssetSpace dependsOn coverage audit (audit assetspace-depends --self, blocking unless warn_only / depends_gate:false)
        id: depends
        # Only meaningful over the registry-resolved layout; skipped (not judged)
        # when resolve_deps is off or the registry could not be cloned.
        if: ${{ inputs.resolve_deps && steps.deps.outputs.depends_vault != '' }}
        continue-on-error: ${{ inputs.warn_only || !inputs.depends_gate }}
        # RFC 306dcb5c coverage gate (req 04208713): judged BY CLOSURE; prints BOTH
        # numbers (uncovered by closure = verdict, uncovered directly = informational)
        # with the vault scope label; exit 0 OK / 1 FAIL / 2 BROKEN (degenerate
        # population — an empty input is never reported clean).
        #
        # ⚠ LIMITATION, named on purpose (see header step 6): this catches a MISSING
        # declaration for a reference THIS repo makes; it cannot catch a declaration
        # DELETED in kitelev/exoas-registry until this repo pushes again. Do not
        # read green here as "the registry is intact" — that is N3's job.
        run: |
          set -uo pipefail
          DEPVAULT="${{ steps.deps.outputs.depends_vault }}"
          CLI="@kitelev/exocortex-cli@${{ inputs.cli_version }}"
          # Fail-open ONLY on a CLI that predates the verb — and say so loudly, so a
          # pinned old cli_version cannot be mistaken for a passing gate.
          if ! npx -y "$CLI" audit --help 2>/dev/null | grep -q 'assetspace-depends'; then
            echo "⚠️  $CLI has no 'audit assetspace-depends' (needs the req 04208713 release) — step SKIPPED, NOT judged." | tee "$RUNNER_TEMP/depends-report.txt"
            echo "depends_status=skipped-no-verb" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Declared deps step 1 could not clone → --missing-deps-file (req 8d432214):
          # the verb EXCUSES unresolved refs into an explicit DEGRADED verdict and
          # prints the blind spot; refs into a PRESENT undeclared AssetSpace still
          # FAIL. A pinned CLI without the flag says so loudly and judges strictly.
          MISSING="${{ steps.deps.outputs.missing_deps_file }}"
          # ${ARR[@]+"${ARR[@]}"}: an EMPTY array under `set -u` is "unbound" on
          # bash < 4.4 — the runner's bash 5 tolerates it, the idiom works on both.
          MISSING_ARGS=()
          if [ -n "$MISSING" ] && [ -s "$MISSING" ]; then
            if npx -y "$CLI" audit assetspace-depends --help 2>/dev/null | grep -q -- '--missing-deps-file'; then
              MISSING_ARGS=(--missing-deps-file "$MISSING")
              echo "ℹ️  declared deps NOT materialised (clone failed) — passed as --missing-deps-file (req 8d432214): $(tr '\n' ' ' < "$MISSING")"
            else
              echo "⚠️  $CLI has no --missing-deps-file (needs the req 8d432214 release) — the $(wc -l < "$MISSING" | tr -d ' ') un-cloned declared dep(s) will read as UNCOVERED; bump cli_version." | tee "$RUNNER_TEMP/depends-report.txt"
            fi
          fi
          npx -y "$CLI" audit assetspace-depends \
            --vault "$DEPVAULT" \
            --registry "$RUNNER_TEMP/registry" \
            --self "${{ github.repository }}" \
            ${MISSING_ARGS[@]+"${MISSING_ARGS[@]}"} \
            --output text 2>&1 | tee -a "$RUNNER_TEMP/depends-report.txt"
          rc="${PIPESTATUS[0]}"
          status=judged
          if grep -q '^OK (DEGRADED' "$RUNNER_TEMP/depends-report.txt"; then
            status=judged-degraded
            echo "::warning title=assetspace-depends DEGRADED::declared dependsOn target(s) absent from the merged vault — coverage NOT proven for refs into them; pass registry_token to make the merged vault complete"
          fi
          echo "depends_status=$status" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Command smoke (opt-in behavioural gate)
        id: smoke
        if: ${{ inputs.command_smoke }}
        continue-on-error: ${{ inputs.warn_only }}
        env:
          GH_CLONE_TOKEN: ${{ secrets.registry_token }}
          GIT_ALLOW_PROTOCOL: "https:ssh"
          SMOKE_CLI: ${{ inputs.command_smoke_cli }}
          SMOKE_SOURCES: ${{ inputs.command_smoke_sources }}
        # Behavioural complement to the SHACL gate: SHACL proves the data is
        # WELL-FORMED, this proves a command still DOES what its inheritance
        # rules promise. Runs the real `apply` (⛔ never --dry-run: it prints a
        # preview, not the written frontmatter) against a copy of the merged
        # vault, so nothing the smoke writes can reach the repo checkout.
        run: |
          set -uo pipefail
          MERGED="${{ steps.deps.outputs.merged_dir }}"
          if [ -n "$MERGED" ] && [ -d "$MERGED" ]; then
            SMOKE="$RUNNER_TEMP/smoke"
            rm -rf "$SMOKE"; cp -R "$MERGED" "$SMOKE"
          else
            SMOKE="$RUNNER_TEMP/smoke"
            rm -rf "$SMOKE"; mkdir -p "$SMOKE/_self"
            rsync -a --exclude='.git' ./ "$SMOKE/_self/"
          fi

          # Extra runtime-only TBox sources (see the command_smoke_sources docs).
          i=0
          for url in $SMOKE_SOURCES; do
            i=$((i + 1))
            auth="$url"
            if [ -n "${GH_CLONE_TOKEN:-}" ] && printf '%s' "$url" | grep -q '^https://github.com/'; then
              auth="https://x-access-token:${GH_CLONE_TOKEN}@github.com/${url#https://github.com/}"
            fi
            echo "::group::Clone smoke source $url"
            if git clone --depth 1 -- "$auth" "$RUNNER_TEMP/smoke-src-$i"; then
              rsync -a --exclude='.git' "$RUNNER_TEMP/smoke-src-$i/" "$SMOKE/_smoke-src-$i/"
            else
              echo "❌ command smoke: could not clone $url — the fixture's TBox would be missing, which makes the smoke vacuous."
              exit 1
            fi
            echo "::endgroup::"
          done

          # ems__Task fixture. UID-named, class by UID (1b20a8f0 = ems__Task),
          # status Backlog (753a44d5) so the command's precondition admits it.
          TASK_UID="$(uuidgen | tr 'A-Z' 'a-z')"
          cat > "$SMOKE/ci-smoke-task.md" <<FIXTURE
          ---
          exo__Asset_uid: $TASK_UID
          exo__Asset_createdAt: 2026-01-01T00:00:00
          exo__Instance_class:
            - "[[1b20a8f0-d745-4e93-91db-4531b3df120e]]"
          exo__Asset_label: CI command-smoke Task
          ems__Effort_status: "[[753a44d5-846c-4b82-9196-4fd9a4d48777]]"
          ---

          Fixture for the AssetSpace CI command smoke. Not part of the repo.
          FIXTURE
          sed -i 's/^          //' "$SMOKE/ci-smoke-task.md"

          # Canary: the fixture's class must actually resolve in this vault,
          # otherwise a green smoke would mean nothing (the rule's condition is
          # matched by UID and would silently never fire).
          if ! find "$SMOKE" -name '1b20a8f0-d745-4e93-91db-4531b3df120e.md' | grep -q .; then
            echo "❌ command smoke: ems__Task class def (1b20a8f0) is not present in the smoke vault."
            echo "   The dependsOn closure does not carry the ems TBox — add its repo to command_smoke_sources."
            exit 1
          fi

          BEFORE="$(find "$SMOKE" -name '*.md' | wc -l | tr -d ' ')"
          echo "::group::apply $SMOKE_CLI"
          npx -y @kitelev/exocortex-cli@${{ inputs.cli_version }} apply "$SMOKE_CLI" \
            "ci-smoke-task.md" --vault "$SMOKE" --input '{"label":"ci-command-smoke"}' --yes \
            | tee "$RUNNER_TEMP/smoke-apply.txt"
          rc="${PIPESTATUS[0]}"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "❌ command smoke: apply $SMOKE_CLI exited $rc"
            exit 1
          fi

          AFTER="$(find "$SMOKE" -name '*.md' | wc -l | tr -d ' ')"
          if [ "$AFTER" -le "$BEFORE" ]; then
            echo "❌ command smoke: apply reported success but created no file ($BEFORE → $AFTER)."
            exit 1
          fi

          CREATED="$(sed -n 's/.*→ //p' "$RUNNER_TEMP/smoke-apply.txt" | tail -1)"
          if [ -z "$CREATED" ] || [ ! -f "$SMOKE/$CREATED" ]; then
            echo "❌ command smoke: could not locate the created asset (parsed: '${CREATED:-<empty>}')."
            exit 1
          fi
          echo "Created: $CREATED"
          cat "$SMOKE/$CREATED"

          if ! grep -q "ems__Effort_parent:.*$TASK_UID" "$SMOKE/$CREATED"; then
            echo "❌ command smoke: the created asset has no ems__Effort_parent pointing at the fixture task ($TASK_UID)."
            echo "   The Task-conditioned inheritance rule is not reaching this command — it was probably unwired."
            exit 1
          fi
          echo "✅ ems__Effort_parent → $TASK_UID"

          # The write must not introduce new violations either.
          npx -y @kitelev/exocortex-cli@${{ inputs.cli_version }} validate schema \
            --shapes-mode --vault "$SMOKE" --output text | tee "$RUNNER_TEMP/smoke-shacl.txt"
          exit "${PIPESTATUS[0]}"

      - name: CI summary
        if: always()
        run: |
          {
            echo "## AssetSpace CI — ${{ github.repository }}"
            echo "Mode: ${{ inputs.warn_only && 'warn-only (non-blocking pilot)' || 'blocking gate' }}"
            echo "Dependency resolution: ${{ inputs.resolve_deps && 'registry-driven single-graph merge (issue #3513 / #3523)' || 'disabled (standalone)' }}"
            echo ""
            echo "### SHACL-lite (validate schema --shapes-mode)  outcome=${{ steps.shacl.outcome }}"
            echo '```'
            tail -25 "$RUNNER_TEMP/shacl-report.txt" 2>/dev/null || echo "(no report)"
            echo '```'
            echo "### ontology-imports audit  outcome=${{ steps.imports.outcome }}"
            echo '```'
            tail -10 "$RUNNER_TEMP/imports-report.txt" 2>/dev/null || echo "(no report)"
            echo '```'
            echo "### ontology-membership audit  outcome=${{ steps.membership.outcome }}"
            echo '```'
            tail -10 "$RUNNER_TEMP/membership-report.txt" 2>/dev/null || echo "(no report)"
            echo '```'
            echo "### assetspace-depends coverage audit (--self ${{ github.repository }})  outcome=${{ steps.depends.outcome }}  status=${{ steps.depends.outputs.depends_status || 'not-run' }}  gate=${{ inputs.depends_gate && 'blocking' || 'advisory' }}"
            echo "_Catches a MISSING declaration for this repo's references; a declaration DELETED in exoas-registry is only re-checked on this repo's next push (RFC 306dcb5c N3 covers that). status=judged-degraded = a declared dep was NOT cloned (see step 1) — DEGRADED is not proven coverage (req 8d432214)._"
            echo '```'
            tail -15 "$RUNNER_TEMP/depends-report.txt" 2>/dev/null || echo "(no report)"
            echo '```'
            if [ "${{ inputs.command_smoke }}" = "true" ]; then
              echo "### command smoke (${{ inputs.command_smoke_cli }})  outcome=${{ steps.smoke.outcome }}"
              echo '```'
              tail -20 "$RUNNER_TEMP/smoke-apply.txt" 2>/dev/null || echo "(no report)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
